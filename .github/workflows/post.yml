name: Post Instagram Story


on:
  schedule:
    - cron: '0 6 * * *'→ Runs at 06:00    # 10:00 AM UAE (UTC+4)
    - cron: '0 16 * * *'→ Runs at 16:00   # 8:00 PM UAE (UTC+4)
  workflow_dispatch:


jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests
      - run: python post_story.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          APP_ID:       ${{ secrets.APP_ID }}
          APP_SECRET:   ${{ secrets.APP_SECRET }}
          IG_USER_ID:   ${{ secrets.IG_USER_ID }}
      - name: Save posted tracker
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Bot"
          git add .posted.json post.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update post tracker [skip ci]"
          git push || true

